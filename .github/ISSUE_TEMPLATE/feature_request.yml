name: Feature request
description: Something Trefoil should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The problem, rather than one particular solution to it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
