name: trefoil
description: "Trefoil - a proxy client for Android."
# Not a package for pub.dev.
publish_to: 'none'

# <versionName>+<versionCode>. scripts/release.sh refuses a build number that is not
# higher than the published one.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Subscription fetching.
  http: ^1.6.0
  # Resolves the app-private directory used for profile storage.
  path_provider: ^2.1.6
  # QR scanning for share links and subscription URLs.
  mobile_scanner: ^7.4.0
  # Clash/Meta subscriptions ship as YAML. Promoted from the transitive dependency
  # it already was rather than hand-rolling a parser: the formats providers emit mix
  # block and flow style, quoted and bare scalars, and nested option maps, and a
  # subset parser that silently mis-reads one of them produces a server that looks
  # imported and cannot connect.
  yaml: ^3.1.3
  # Wallpaper-derived colour scheme on Android 12+.
  # Held at 1.x deliberately: 2.0 moved to the ColorScheme of the separate
  # material_ui package, which is a different type from Flutter's own and does
  # not fit ThemeData. Upgrading means adopting that package wholesale.
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generates AppLocalizations from lib/l10n/*.arb; see l10n.yaml.
  generate: true
  # The Material Icons font.
  uses-material-design: true
